<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Valorant Roast</title>
  <meta name="description" content="Pick server, ID. Get roasted.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Clean Apple-style Header -->
    <header class="app-header">
      <h1 class="main-title">Roast.</h1>
      <p class="subtitle">Pick server, ID. Get roasted. :)</p>
    </header>

    <!-- Search Section -->
    <section class="search-section" aria-label="Player Search">
      <form id="roast-form" class="search-form" novalidate>
        <!-- Server / Region Selector -->
        <div class="input-field region-field">
          <label for="player-region">Server</label>
          <div class="select-wrap">
            <select id="player-region" required>
              <option value="na" selected>North America (NA)</option>
              <option value="eu">Europe (EU)</option>
              <option value="ap">Asia-Pacific (AP)</option>
              <option value="kr">Korea (KR)</option>
              <option value="latam">Latin America (LATAM)</option>
              <option value="br">Brazil (BR)</option>
            </select>
            <span class="select-arrow">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </span>
          </div>
        </div>

        <div class="input-group">
          <div class="input-field name-field">
            <label for="player-name">Riot ID</label>
            <input 
              type="text" 
              id="player-name" 
              placeholder="type username" 
              autocomplete="off" 
              spellcheck="false" 
              required
            >
          </div>
          <div class="input-field tag-field">
            <label for="player-tag">Tag</label>
            <div class="tag-input-wrap">
              <span class="hash-prefix">#</span>
              <input 
                type="text" 
                id="player-tag" 
                placeholder="0001" 
                maxlength="8" 
                autocomplete="off" 
                spellcheck="false" 
                required
              >
            </div>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-roast">
          <span class="btn-text">Get Roasted</span>
          <span class="btn-loader" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Quick sample suggestions -->
      <div class="sample-tags">
        <span>Examples:</span>
        <button type="button" class="chip-btn" data-name="TenZ" data-tag="0001" data-region="na">TenZ#0001</button>
        <button type="button" class="chip-btn" data-name="Derke" data-tag="FNC" data-region="eu">Derke#FNC</button>
        <button type="button" class="chip-btn" data-name="Jinggg" data-tag="PRX" data-region="ap">Jinggg#PRX</button>
      </div>

      <!-- Error Message Banner -->
      <div id="error-banner" class="error-banner hidden" role="alert">
        <p id="error-message" class="error-text"></p>
      </div>
    </section>

    <!-- Results / Card Stack Section -->
    <main id="results-section" class="results-section hidden">
      <div class="deck-controls-top">
        <div class="player-info-badge">
          <span id="player-label">Player</span>
        </div>
        <div class="card-counter">
          <span id="current-card-num">1</span> / <span id="total-cards-num">4</span>
        </div>
      </div>

      <!-- Swipeable Deck Area -->
      <div class="card-viewport" id="card-viewport">
        <div class="card-stack" id="card-stack">
          <!-- Cards injected here -->
        </div>
      </div>

      <!-- Navigation Controls -->
      <div class="deck-navigation">
        <button type="button" id="prev-btn" class="nav-btn" aria-label="Previous card" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>

        <div class="indicators" id="indicators" aria-label="Card progress">
          <!-- Indicator dots -->
        </div>

        <button type="button" id="next-btn" class="nav-btn" aria-label="Next card">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <div class="swipe-hint">
        <span>Swipe or use arrows</span>
      </div>

      <div class="deck-actions">
        <button type="button" id="new-search-btn" class="btn-secondary">Search another</button>
      </div>
    </main>

    <!-- Clean Minimal Footer -->
    <footer class="app-footer">
      <p>Not affiliated with Riot Games.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
